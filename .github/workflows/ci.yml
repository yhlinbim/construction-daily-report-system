name: .NET CI/CD Pipeline

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: cdrs-poc-hansl
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ConstructionDailyReport.sln

    - name: Build solution
      run: dotnet build ConstructionDailyReport.sln --no-restore --configuration Release

    - name: Run unit and integration tests
      run: >
        dotnet test CDRS.Tests/CDRS.Tests.csproj
        --no-build
        --configuration Release
        --verbosity normal
        --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: "**/*.trx"

    - name: Publish web app
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: >
        dotnet publish CDRS.Web/CDRS.Web.csproj
        --configuration Release
        --output ./publish

    - name: Upload publish artifact
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: webapp
        path: ./publish

  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ConstructionDailyReport.sln

    - name: Install EF Core tools
      run: dotnet tool install --global dotnet-ef

    - name: Run migrations
      run: |
        dotnet ef database update \
          --project CDRS.Infrastructure \
          --startup-project CDRS.Web \
          --connection "${{ secrets.AZURE_SQL_CONNECTION_STRING }}"

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: migrate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write   # Required for OIDC token exchange with Azure AD
      contents: read

    steps:
    - name: Download publish artifact
      uses: actions/download-artifact@v4
      with:
        name: webapp
        path: ./publish

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ./publish

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Wait for app to start
      run: sleep 30

    - name: Liveness check
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" -L \
          https://cdrs-poc-hansl-hnh3gvavdsf7b3a5.australiaeast-01.azurewebsites.net/health/live)
        echo "Liveness response: $response"
        if [ "$response" != "200" ]; then
          echo "Liveness check failed with status $response"
          exit 1
        fi

    - name: Readiness check
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" -L \
          https://cdrs-poc-hansl-hnh3gvavdsf7b3a5.australiaeast-01.azurewebsites.net/health/ready)
        echo "Readiness response: $response"
        if [ "$response" != "200" ]; then
          echo "Readiness check failed with status $response"
          exit 1
        fi

    - name: Swagger UI check
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" -L \
          https://cdrs-poc-hansl-hnh3gvavdsf7b3a5.australiaeast-01.azurewebsites.net/swagger)
        echo "Swagger UI response: $response"
        if [ "$response" != "200" ]; then
          echo "Swagger UI check failed with status $response"
          exit 1
        fi