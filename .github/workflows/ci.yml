name: .NET CI/CD Pipeline

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: cdrs-poc-hansl
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ConstructionDailyReport.sln

    - name: Build solution
      run: dotnet build ConstructionDailyReport.sln --no-restore --configuration Release

    - name: Run unit tests
      run: >
        dotnet test CDRS.UnitTests/CDRS.UnitTests.csproj
        --no-build
        --configuration Release
        --verbosity normal
        --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: "**/*.trx"

    - name: Publish web app
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: >
        dotnet publish CDRS.Web/CDRS.Web.csproj
        --configuration Release
        --output ./publish

    - name: Upload publish artifact
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: webapp
        path: ./publish

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Download publish artifact
      uses: actions/download-artifact@v4
      with:
        name: webapp
        path: ./publish

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish