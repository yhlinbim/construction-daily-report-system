# Local "production-like" run: the app plus SQL Server, EF Core migrations
# applied on startup. For a zero-setup look with no database, just run
# `dotnet run --project CDRS.Web` (falls back to a local SQLite file).
#
#   cp .env.example .env      # then edit MSSQL_SA_PASSWORD
#   docker compose up --build
#
# App:     http://localhost:8080/swagger
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env (see .env.example)}
    ports:
      - "1433:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Server=db;Database=ConstructionDailyReportDb;User Id=sa;
        Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
